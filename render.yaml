services:
  - type: web
    name: wearthehope-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/content
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: wearthehope
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
